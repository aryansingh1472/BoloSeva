services:
  backend:
    build:
      context: ./backend
    environment:
      BOLOSEVA_DB: /data/boloseva.db

    volumes:
      - boloseva-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SPEECH_CONFIDENCE_THRESHOLD: ${VITE_SPEECH_CONFIDENCE_THRESHOLD:-0.65}
        VITE_SILENCE_BUFFER_MS: ${VITE_SILENCE_BUFFER_MS:-1500}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  boloseva-data:
